<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panda 遥操作仿真</title>
<script type="importmap">{"imports":{"three":"/web/three.module.js"}}</script>
<style>
:root{color-scheme:light;--ink:#102b37;--muted:#6c8087;--accent:#087f8c;--line:#dce5e7;--red:#c34148}*{box-sizing:border-box}body{margin:0;background:#f5f8f8;color:var(--ink);font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}header{padding:24px 34px 18px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0 0 5px;font-weight:700}header p{font-size:13px;margin:0;color:var(--muted)}#mode{font-size:20px;color:var(--accent);font-weight:700}main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;padding:24px 34px;max-width:1700px;margin:auto}.scene{background:#e8eeef;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;min-height:550px}#canvas{width:100%;height:100%;min-height:550px;display:block}.sceneLabel{position:absolute;left:22px;top:20px;font-size:14px;color:#45616a;pointer-events:none}.sceneFoot{position:absolute;left:22px;bottom:18px;font-size:12px;color:#657d86;pointer-events:none}aside{background:white;border:1px solid var(--line);border-radius:10px;padding:22px}h2{font-size:18px;margin:0 0 16px}.row{margin-bottom:13px}.row label{font-size:13px;display:flex;justify-content:space-between;color:#35515c}.row output{font-family:monospace;color:var(--ink)}input[type=range]{width:100%;accent-color:var(--accent);margin-top:7px}button{border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:white;font:inherit;font-size:13px;cursor:pointer}button:hover{background:#edf6f6}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.danger{color:var(--red);border-color:#e8b9bc}button:disabled{opacity:.4;cursor:default}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.hint{font-size:12px;line-height:1.7;color:var(--muted);margin:14px 0 0}.telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:18px 22px;background:white;border:1px solid var(--line);border-radius:8px;margin-top:18px}.telemetry small{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.telemetry strong{font-size:21px;font-weight:600}.notice{padding:11px 14px;font-size:13px;background:#edf6f6;color:#285765;margin-top:16px;border-radius:5px;line-height:1.6}footer{padding:0 34px 22px;color:var(--muted);font-size:12px}#message{min-height:40px;margin-top:13px;font-size:12px;line-height:1.6;color:#4d6771}.banner{background:#e6f3ee;color:#25654b;padding:12px;display:none;margin-top:12px}#pause.paused{color:white;background:#b37a20}@media(max-width:950px){main{grid-template-columns:1fr;padding:18px}.scene,#canvas{min-height:420px}header{padding:18px}aside{padding:18px}.row{margin-bottom:9px}}
</style></head><body><header><div><h1>Panda 遥操作仿真</h1><p>Franka Panda 模型 · 人工关节输入 · 轨迹采集</p></div><div id="mode">初始化</div></header><main><section><div class="scene"><canvas id="canvas"></canvas><div class="sceneLabel">MuJoCo 动力学状态实时显示</div><div class="sceneFoot">拖动视角 · 滚轮缩放 · 本次为仿真演示</div></div><div class="telemetry"><div><small>记录时长</small><strong id="time">0.0 s</strong></div><div><small>已保存采样</small><strong id="rows">0</strong></div><div><small>最大关节跟踪差</small><strong id="error">0.000 rad</strong></div></div><div class="notice" id="event">模型加载中，请稍候。</div></section><aside><h2>人工控制</h2><div id="sliders"></div><div class="row"><label for="gripper">夹爪闭合比例 <output id="gripper-value">0%</output></label><input id="gripper" type="range" min="0" max="1" step="0.01" value="0"></div><div class="buttons"><button id="enable" class="primary">开启跟随</button><button id="align">对齐当前位置</button><button id="pause">暂停指令发送</button><button id="estop" class="danger">软件急停</button><button id="reset">本地复位</button><button id="finish">结束并保存</button></div><p class="hint">先开启跟随，再拖动关节滑块。暂停发送可演示断流保护。恢复后需要再次开启跟随。</p><div id="message"></div><div id="saved" class="banner">轨迹已结束并保存。可以关闭此页面。</div></aside></main><footer>模型来源：MuJoCo Menagerie，Apache-2.0。滑块作为虚拟操作器，本次未连接物理 GELLO 或机械臂。</footer><script>window.CONTROL_TOKEN="__CONTROL_TOKEN__"</script><script type="module" src="/web/app.js"></script></body></html>
